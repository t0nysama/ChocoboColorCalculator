name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore desktop project
        run: dotnet restore .\ChocoboColorCalculator.Desktop\ChocoboColorCalculator.Desktop.csproj -r win-x64

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish .\ChocoboColorCalculator.Desktop\ChocoboColorCalculator.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\desktop-win-x64

      - name: Build desktop ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\package -Force | Out-Null
          Copy-Item .\artifacts\desktop-win-x64\ChocoboColorCalculator.Desktop.exe .\artifacts\package\
          Copy-Item .\ChocoboColorCalculator.Desktop\README.txt .\artifacts\package\
          Copy-Item .\LICENSE .\artifacts\package\
          Compress-Archive -Path .\artifacts\package\* -DestinationPath .\artifacts\ChocoboColorCalculator-Desktop-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChocoboColorCalculator-Desktop-win-x64
          path: .\artifacts\ChocoboColorCalculator-Desktop-win-x64.zip

      - name: Publish desktop GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chocobo Color Calculator Desktop ${{ github.ref_name }}
          files: .\artifacts\ChocoboColorCalculator-Desktop-win-x64.zip
          generate_release_notes: true
          make_latest: false
